version: "3.9"

services:
  traefik:
    image: traefik:v3.1
    command:
      - --providers.docker=true
      - --entrypoints.web.address=:80
      - --api.dashboard=true
    ports:
      - "80:80"
    depends_on:
      - frontend
      - api
      - postgres
      - redis
      - minio
    networks: [appnet]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    labels:
      - traefik.enable=true
      - traefik.http.routers.traefik.rule=Host(`traefik.localhost`)
      - traefik.http.routers.traefik.entrypoints=web
      - traefik.http.services.traefik.loadbalancer.server.port=8080
      - traefik.http.routers.traefik.service=api@internal

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - PORT=4000
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - JWT_SECRET=${JWT_SECRET}
      - FRONTEND_URL=http://frontend:3000
      - KAFKA_BROKER=kafka:9092
    depends_on:
      - postgres
      - redis
    networks: [appnet]
    ports:
      - "4000:4000"
    labels:
      - traefik.enable=true
      - traefik.http.routers.api.rule=Host(`api.localhost`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=4000
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - NEXT_PUBLIC_API_URL=http://api.localhost:4000
      - API_INTERNAL_URL=http://api:4000
      - KYC_URL=http://kyc:4100/kyc
      - HOSTNAME=0.0.0.0
    depends_on:
      - api
    networks: [appnet]
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/prisma:/app/prisma
    labels:
      - traefik.enable=true
      - traefik.http.routers.app.rule=Host(`app.localhost`)
      - traefik.http.routers.app.entrypoints=web
      - traefik.http.services.app.loadbalancer.server.port=3000
      - traefik.docker.network=appnet   # fixed name
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=winederful
    ports:
      - "5432:5432"
    volumes:
      - ./data/import:/import
      - pgdata:/var/lib/postgresql/data
    networks: [appnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks: [appnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=minioadmin
      - MINIO_ROOT_PASSWORD=minioadmin123
      - MINIO_BROWSER_REDIRECT_URL=http://minio.localhost
    volumes:
      - minio_data:/data
    networks: [appnet]
    ports:
      - "9000:9000"
      - "9001:9001"
    labels:
      - traefik.enable=true
      - traefik.http.routers.minio-console.rule=Host(`minio.localhost`)
      - traefik.http.routers.minio-console.entrypoints=web
      - traefik.http.routers.minio-console.service=minio-console
      - traefik.http.services.minio-console.loadbalancer.server.port=9001
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 60s

  minio-init:
    image: minio/mc:RELEASE.2024-08-13T05-33-17Z
    depends_on:
      - minio
    entrypoint: /scripts/init-minio.sh
    volumes:
      - ./scripts:/scripts
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER:-admin}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD:-change-me-strong}
    networks: [appnet]

  mongodb:
    image: mongo:7
    container_name: mongodb
    profiles: ["kafka"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: wineshop_events
    volumes:
      - mongo_data:/data/db
    networks: [appnet]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-express:
    image: mongo-express:latest
    container_name: mongo-express
    profiles: ["kafka"]
    depends_on:
      - mongodb
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: admin
    networks: [appnet]
    labels:
      - traefik.enable=true
      - traefik.http.routers.mongo-express.rule=Host(`mongo.localhost`)
      - traefik.http.services.mongo-express.loadbalancer.server.port=8081

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    profiles: ["kafka"]
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [appnet]
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    profiles: ["kafka"]
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "19092:19092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:19092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
    networks: [appnet]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kyc:
    build:
      context: ./kyc-service
      dockerfile: Dockerfile
    image: winederful-kyc
    environment:
      PORT: 4100
    depends_on:
      - minio
    ports:
      - "4100:4100"
    networks: [appnet]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4100/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  grafana:
    image: grafana/grafana:latest
    ports:
    	- "3001:3000"        # host 3001 → container 3000
    environment:
    	- GF_INSTALL_PLUGINS=yesoreyeram-infinity-datasource,marcusolsson-csv-datasource
    volumes:
    	- grafana_data:/var/lib/grafana
    networks: [appnet]
    labels:
    - traefik.enable=true
    - traefik.http.routers.grafana.rule=Host(`grafana.localhost`)
    - traefik.http.routers.grafana.entrypoints=web
    - traefik.http.services.grafana.loadbalancer.server.port=3000
    - traefik.docker.network=appnet

  csvserver:
    image: python:3.12-alpine
    working_dir: /data
    command: python -m http.server 8000
    volumes:
      - ./csv:/data
    ports:
      - "8000:8000"
    networks: [appnet]

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    profiles: ["kafka"]
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: wineshop-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks: [appnet]
    labels:
      - traefik.enable=true
      - traefik.http.routers.kafka-ui.rule=Host(`kafka.localhost`)
      - traefik.http.routers.kafka-ui.entrypoints=web
      - traefik.http.services.kafka-ui.loadbalancer.server.port=8080

  kafka-consumer-snowflake:
    build:
      context: ./kafka-consumers
      dockerfile: Dockerfile
    container_name: kafka-consumer-snowflake
    profiles: ["kafka"]
    command: ["python", "-u", "consumer_snowflake.py"]
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: wine-orders
      KAFKA_GROUP_ID: wine-snowflake-consumer
      BATCH_SIZE: 50
      BATCH_TIMEOUT_SECS: 10
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
      SNOWFLAKE_WAREHOUSE: ${SNOWFLAKE_WAREHOUSE:-COMPUTE_WH}
      SNOWFLAKE_DATABASE: ${SNOWFLAKE_DATABASE:-WINESHOP}
      SNOWFLAKE_SCHEMA: ${SNOWFLAKE_SCHEMA:-RAW}
    networks: [appnet]
    restart: unless-stopped

  kafka-consumer-email:
    build:
      context: ./kafka-consumers
      dockerfile: Dockerfile
    container_name: kafka-consumer-email
    profiles: ["kafka"]
    command: ["python", "-u", "consumer_email.py"]
    depends_on:
      - kafka
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPIC: payment-events
      KAFKA_GROUP_ID: wine-email-service
      SMTP_HOST: ${SMTP_HOST:-localhost}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      FROM_EMAIL: ${FROM_EMAIL:-no-reply@wineshop.local}
    networks: [appnet]
    restart: unless-stopped

  kafka-consumer-mongodb:
    build:
      context: ./kafka-consumers
      dockerfile: Dockerfile
    container_name: kafka-consumer-mongodb
    profiles: ["kafka"]
    command: ["python", "-u", "consumer_mongodb.py"]
    depends_on:
      - kafka
      - mongodb
    environment:
      KAFKA_BROKER: kafka:9092
      KAFKA_TOPICS: wine-orders,payment-events,order-status,inventory-updates
      KAFKA_GROUP_ID: wine-mongodb-logger
      MONGO_URI: mongodb://mongodb:27017/
      MONGO_DB: wineshop_events
      MONGO_COLLECTION: kafka_events
    networks: [appnet]
    restart: unless-stopped

networks:
  appnet: {}

volumes:
  pgdata: {}
  redis_data: {}
  minio_data: {}
  mongo_data: {}
  grafana_data: {}   # <-- added so Grafana starts